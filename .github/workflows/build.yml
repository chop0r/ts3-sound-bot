name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  panel:
    name: Web panel builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - run: npm run build
        working-directory: webui

  bot:
    name: Patches apply and the bot compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the self-contained bot (fails if the patches no longer apply to the pinned upstream commit)
        run: |
          mkdir -p build/ctx
          cp -r bot webui build/ctx/
          docker build -f native/build/Dockerfile --target export --output type=local,dest=build/out build/ctx

  release:
    name: Release archives
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [panel, bot]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the archives
        shell: pwsh
        run: ./scripts/package.ps1 -Version "${{ github.ref_name }}"
      - name: Publish them on the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
