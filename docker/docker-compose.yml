# Settings come from .env, which install.ps1 / install.sh create. Do not edit this file, edit .env instead.
name: ts3-sound-bot-${BOT_CONTAINER:-ts3musicbot}
services:
  musicbot:
    build:
      context: ${BUILD_CONTEXT:-..}                  # repository root (the installer sets "." for the flattened release zip)
      dockerfile: ${BUILD_DOCKERFILE:-docker/Dockerfile}
    image: ${BOT_IMAGE:-ts3musicbot:latest}
    container_name: ${BOT_CONTAINER:-ts3musicbot}
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-58913}:58913"   # web panel (HTTPS, self-signed certificate)
    extra_hosts:
      - "host.docker.internal:host-gateway"                  # lets the bot reach a TeamSpeak server running on this machine
    environment:
      YTDLP_PROXY: ${YTDLP_PROXY:-}
    volumes:
      - ./data:/app/data                                     # settings, playlists, logs, cookies.txt
      - musicbot-db:/app/db                                  # LiteDB database (does not work on a Windows folder)
    command: ["--non-interactive", "--stats-disabled"]
volumes:
  musicbot-db:
    name: ${BOT_CONTAINER:-ts3musicbot}-db
